<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QCM Poker - Tableau Hote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='host_dashboard.css') }}" />
</head>
<body class="pk-bg pk-dashboard">
  <div class="pk-overlay" aria-hidden="true"></div>

  <div class="pkd-shell">
    <header class="pkd-header">
      <div class="pkd-brand">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="pkd-logo" />
        <div class="pkd-brand-text">
          <div class="pkd-brand-title">QCM Poker</div>
          <div class="pkd-brand-sub">Tableau hote</div>
        </div>
      </div>

      <div class="pkd-code">
        <div class="pkd-code-label">Code de la partie</div>
        <div class="pkd-code-row">
          <div class="pkd-code-value" id="lobbyId">{{ lobby_id }}</div>
          <button class="pkd-icon-btn" type="button" id="copyCode" title="Copier">Copier</button>
        </div>
        <div id="statusBadge" class="pkd-badge is-waiting">En attente</div>
      </div>

      <div class="pkd-actions">
        <a class="pkd-link" href="/lobby/{{ lobby_id }}/client" target="_blank" rel="noopener">Ouvrir la vue joueur</a>
        <a class="pkd-link" href="/">Accueil</a>
      </div>
    </header>

    <main class="pkd-main">
      <aside class="pkd-side">
        <div class="pkd-panel">
          <div class="pkd-panel-title">Controle</div>
          <div id="buttonContainer" class="pkd-buttons"></div>
          <div id="hostMsg" class="pkd-msg" role="status" aria-live="polite"></div>
        </div>

        <div class="pkd-panel">
          <div class="pkd-panel-title">Etat</div>
          <div class="pkd-stats">
            <div class="pkd-stat">
              <div class="pkd-stat-label">Phase</div>
              <div class="pkd-stat-value" id="phase">waiting</div>
            </div>
            <div class="pkd-stat">
              <div class="pkd-stat-label">Question</div>
              <div class="pkd-stat-value"><span id="qIndex">-</span> / <span id="qTotal">-</span></div>
            </div>
            <div class="pkd-stat">
              <div class="pkd-stat-label">Temps</div>
              <div class="pkd-stat-value"><span id="timeRemaining">-</span>s</div>
            </div>
          </div>
        </div>
      </aside>

      <section class="pkd-center">
        <div class="pkd-panel pkd-question-panel">
          <div class="pkd-panel-title">Question courante</div>

          <div id="questionBox" class="pkd-question" style="display:none">
            <div class="pkd-qmeta">
              <div class="pkd-qcat" id="category">Categorie</div>
              <div class="pkd-pot">
                <div class="pkd-pot-label">Mise totale</div>
                <div class="pkd-pot-value" id="potTotal">0</div>
              </div>
            </div>
            <div class="pkd-qprompt" id="prompt">...</div>

            <div id="answers" class="pkd-answers"></div>
            <div id="explanationBox" class="pkd-explanation"></div>
          </div>

          <div id="noQuestion" class="pkd-empty">
            La partie n'a pas encore commence. Lance la partie quand tu es pret.
          </div>
        </div>

        <div class="pkd-panel">
          <div class="pkd-panel-title">Classement</div>
          <div id="leaderboard" class="pkd-leaderboard"></div>
        </div>
      </section>

      <aside class="pkd-players">
        <div class="pkd-panel pkd-players-panel">
          <div class="pkd-panel-title" id="playersHeader">Joueurs (0)</div>
          <div id="playersList" class="pkd-players-list"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.LOBBY_ID = "{{ lobby_id }}";
    window.ROLE = "host";
    window.PLAYER_NAME = "{{ player_name }}";
  </script>
  <script src="{{ url_for('static', filename='host_dashboard.js') }}"></script>
</body>
</html>
