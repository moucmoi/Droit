<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Partie Multijoueur - QCM Poker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=pk4" />
  <link rel="stylesheet" href="{{ url_for('static', filename='cinematic.css') }}?v=pk4" />
  <link rel="stylesheet" href="{{ url_for('static', filename='resolution.css') }}?v=pk4" />
</head>
<body class="md-bg pk-play-bg">
  <div id="cineOverlay" class="cine-overlay" aria-hidden="true"></div>

  <div class="md-ambient" aria-hidden="true">
    <div class="md-blob md-blob-a"></div>
    <div class="md-blob md-blob-b"></div>
  </div>

  <div class="md-shell">
    <header class="md-header">
      <div class="md-brand">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="md-logo" />
      </div>

      <div class="md-header-right">
        <div class="md-pill">
          <span class="md-pill-label">Joueur:</span>
          <span id="playerName" class="md-pill-value">...</span>
        </div>
        <div class="md-pill" id="chipsDisplay" style="display:none;">
          <span class="md-pill-label">Jetons:</span>
          <span id="chips" class="md-pill-value md-gold">0</span>
        </div>
        <div class="md-pill">
          <span class="md-pill-label">Lobby:</span>
          <span class="md-pill-value">{{ lobby_id }}</span>
        </div>
        <a href="/" class="md-btn md-btn-ghost">Accueil</a>
      </div>
    </header>

    <!-- Lobby waiting -->
    <div id="lobbyWaiting" class="md-lobby-waiting">
      <div class="md-lobby-container">
        <div class="md-lobby-header">
          <h1 class="md-lobby-title" contenteditable="false"></h1>
          <p class="md-lobby-subtitle" contenteditable="false"></p>
        </div>

        <div class="md-lobby-players">
          <div class="md-lobby-players-title">
            <span class="md-star">?</span>
            Joueurs connectes
            <span class="md-lobby-count" id="lobbyPlayerCount">0</span>
          </div>
          <div id="lobbyPlayersList" class="md-lobby-players-list"></div>
        </div>

        <div class="md-lobby-footer">
          <div class="md-lobby-hint">
            <span class="md-lobby-hint-text"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameOver" class="md-game-over" style="display:none;">
      <div class="md-game-over-container">
        <div class="md-game-over-icon"><img src="{{ url_for('static', filename='perdu.jpg') }}" alt="Perdu"></div>
        <h1 class="md-game-over-title"></h1>
        <p class="md-game-over-subtitle"></p>
        <div class="md-game-over-message">
          <p></p>
        </div>
        <div class="md-game-over-stats">
          <div class="md-game-over-stat">
            <div class="md-game-over-stat-label">Score final</div>
            <div class="md-game-over-stat-value" id="finalScore">0</div>
          </div>
        </div>
        <div class="md-game-over-actions">
          <button id="btnSpectator" class="md-btn md-btn-primary">Mode spectateur</button>
        </div>
      </div>
    </div>

    <!-- Game board -->
    <main id="gameBoard" class="md-layout" style="display:none;">
      <section class="md-main">
        <div class="md-question">
          <div class="md-qbadge">
            <div class="md-qbadge-top">Question</div>
            <div class="md-qbadge-num" id="qCounter">-</div>
          </div>

          <div class="md-qtext">
            <div id="category" class="md-qcategory">Categorie</div>
            <div id="prompt" class="md-qprompt">En attente du serveur...</div>
          </div>

          <div class="md-timer" aria-label="Chrono">
            <svg class="md-timer-svg" viewBox="0 0 100 100" role="img">
              <circle class="md-timer-bg" cx="50" cy="50" r="45" />
              <circle id="timerProgress" class="md-timer-fg" cx="50" cy="50" r="45" />
            </svg>
            <div id="timerValue" class="md-timer-value">60</div>
          </div>
        </div>

        <div class="md-board pk-board">
          <div class="md-answers pk-answers" role="group" aria-label="Reponses">
            <button class="md-answer pk-answer" type="button" data-key="A">
              <div class="md-answer-letter">A</div>
              <div id="ansA" class="md-answer-text">...</div>
            </button>
            <button class="md-answer pk-answer" type="button" data-key="B">
              <div class="md-answer-letter">B</div>
              <div id="ansB" class="md-answer-text">...</div>
            </button>
            <button class="md-answer pk-answer" type="button" data-key="C">
              <div class="md-answer-letter">C</div>
              <div id="ansC" class="md-answer-text">...</div>
            </button>
            <button class="md-answer pk-answer" type="button" data-key="D">
              <div class="md-answer-letter">D</div>
              <div id="ansD" class="md-answer-text">...</div>
            </button>
          </div>

          <div class="pk-action-panel">
            <div class="pk-action-row">
              <div class="pk-action-label">Reponse choisie</div>
              <div class="pk-selected" id="selectedInfo">Aucune</div>
            </div>
            <div class="pk-action-row">
              <div class="pk-action-label">Action</div>
              <div class="pk-action-buttons" role="group">
                <button class="pk-action-btn is-active" type="button" data-action="check">Check</button>
                <button class="pk-action-btn" type="button" data-action="bet">Miser</button>
                <button class="pk-action-btn" type="button" data-action="all-in">All-in</button>
              </div>
            </div>
            <div class="pk-bet-row">
              <div class="pk-action-label">Montant</div>
              <div class="pk-bet-inputs">
                <input id="betAmount" class="pk-bet-input" type="number" min="0" step="100" value="0" />
              </div>
            </div>
            <div class="pk-submit-row">
              <button id="submit" class="md-btn md-btn-primary pk-submit" type="button">Valider</button>
            </div>
          </div>

          <div id="message" class="md-message" role="status" aria-live="polite"></div>
        </div>
      </section>

      <!-- Classement masque cote joueurs (revele uniquement a la fin) -->
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.LOBBY_ID = "{{ lobby_id }}";
    window.ROLE = "player";
    window.PLAYER_NAME = "{{ player_name }}";
  </script>
  <script src="{{ url_for('static', filename='lobby_client.js') }}?v=pk4"></script>
  <script src="{{ url_for('static', filename='cinematic.js') }}?v=pk4"></script>
  <script src="{{ url_for('static', filename='resolution.js') }}?v=pk4"></script>
</body>
</html>
