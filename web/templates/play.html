<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Partie - QCM Poker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='cinematic.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='resolution.css') }}" />
</head>
<body class="md-bg pk-play-bg">
  <!-- Overlay cinematique (optionnelle) -->
  <div id="cineOverlay" class="cine-overlay" aria-hidden="true"></div>

  <div class="md-ambient" aria-hidden="true">
    <div class="md-blob md-blob-a"></div>
    <div class="md-blob md-blob-b"></div>
  </div>

  <div class="md-shell">
    <header class="md-header">
      <div class="md-brand">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="md-logo" />
      </div>

      <div class="md-header-right">
        <div class="md-pill">
          <span class="md-pill-label">Joueur:</span>
          <span id="playerName" class="md-pill-value">...</span>
        </div>
        <div class="md-pill">
          <span class="md-pill-label">Jetons:</span>
          <span id="chips" class="md-pill-value md-gold">...</span>
        </div>

        <button id="btn5050" class="md-btn md-btn-secondary" type="button" title="Bonus 50/50 (si disponible)">50/50</button>

        <form method="post" action="/reset" class="md-inline">
          <button class="md-btn md-btn-ghost" type="submit">Nouvelle partie</button>
        </form>
      </div>
    </header>

    <main class="md-layout">
      <section class="md-main">
        <div class="md-question">
          <div class="md-qbadge">
            <div class="md-qbadge-top">Question</div>
            <div class="md-qbadge-num" id="qCounter">1</div>
          </div>

          <div class="md-qtext">
            <div id="category" class="md-qcategory">Categorie</div>
            <div id="prompt" class="md-qprompt">Chargement...</div>
          </div>

          <div class="md-timer" aria-label="Chrono">
            <svg class="md-timer-svg" viewBox="0 0 100 100" role="img">
              <circle class="md-timer-bg" cx="50" cy="50" r="45" />
              <circle id="timerProgress" class="md-timer-fg" cx="50" cy="50" r="45" />
            </svg>
            <div id="timerValue" class="md-timer-value">60</div>
          </div>
        </div>

        <div class="md-board pk-board">
          <!-- Answers -->
          <div class="md-answers pk-answers" role="group" aria-label="Reponses">
            <button class="md-answer pk-answer" type="button" data-key="A">
              <div class="md-answer-letter">A</div>
              <div id="ansA" class="md-answer-text">...</div>
            </button>
            <button class="md-answer pk-answer" type="button" data-key="B">
              <div class="md-answer-letter">B</div>
              <div id="ansB" class="md-answer-text">...</div>
            </button>
            <button class="md-answer pk-answer" type="button" data-key="C">
              <div class="md-answer-letter">C</div>
              <div id="ansC" class="md-answer-text">...</div>
            </button>
            <button class="md-answer pk-answer" type="button" data-key="D">
              <div class="md-answer-letter">D</div>
              <div id="ansD" class="md-answer-text">...</div>
            </button>
          </div>

          <!-- Poker actions -->
          <div class="pk-action-panel">
            <div class="pk-action-row">
              <div class="pk-action-label">Action</div>
              <div class="pk-action-buttons" role="group">
                <button class="pk-action-btn is-active" type="button" data-action="check">Check</button>
                <button class="pk-action-btn" type="button" data-action="bet">Bet</button>
                <button class="pk-action-btn" type="button" data-action="all-in">All-in</button>
              </div>
            </div>

            <div class="pk-bet-row">
              <div class="pk-action-label">Mise</div>
              <div class="pk-bet-inputs">
                <input id="betAmount" class="pk-bet-input" type="number" min="0" step="100" value="100" />
                <div class="pk-quick">
                  <button type="button" class="pk-quick-btn" data-pct="0.25">25%</button>
                  <button type="button" class="pk-quick-btn" data-pct="0.5">50%</button>
                  <button type="button" class="pk-quick-btn" data-pct="0.75">75%</button>
                </div>
              </div>
            </div>

            <div class="pk-submit-row">
              <div class="pk-selected" id="selectedInfo">Choisis une reponse</div>
              <button id="submit" class="md-btn md-btn-primary pk-submit" type="button">Valider</button>
            </div>
          </div>

          <div id="message" class="md-message" role="status" aria-live="polite"></div>
        </div>
      </section>

      <aside class="md-sidebar" aria-label="Classement">
        <div class="md-sidebar-title">
          <span class="md-star">?</span>
          <span>Classement</span>
        </div>
        <div id="leaderboard" class="md-leaderboard"></div>
        <div id="leaderboardFooter" class="md-leaderboard-footer"></div>
      </aside>
    </main>
  </div>

  <script src="{{ url_for('static', filename='cinematic.js') }}"></script>
  <script src="{{ url_for('static', filename='resolution.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
