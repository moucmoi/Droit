<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Podium - QCM Poker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=pk5" />
  <link rel="stylesheet" href="{{ url_for('static', filename='podium_final.css') }}?v=pk5" />
</head>
<body class="md-bg pk-play-bg pk-podium">
  <div class="pk-podium-overlay" aria-hidden="true"></div>

  <div class="pk-podium-shell">
    <header class="pk-podium-header">
      <div class="pk-podium-brand">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="pk-podium-logo" />
        <div>
          <div class="pk-podium-title">Podium final</div>
          <div class="pk-podium-sub">Top 3 de la table</div>
        </div>
      </div>
      <a class="md-btn md-btn-ghost" href="/">Accueil</a>
    </header>

    <main class="pk-podium-main">
      <section class="pk-podium-stage" aria-label="Podium">
        <div class="pk-podium-spot pk-spot-2">
          <div class="pk-spot-rank">2</div>
          <div class="pk-spot-card">
            <div class="pk-spot-name" id="rank2Name">--</div>
            <div class="pk-spot-score">
              <span id="rank2Score">0</span>
              <img class="pk-chip" src="{{ url_for('static', filename='assets/podium/chip.png') }}" alt="Jeton" />
            </div>
          </div>
        </div>

        <div class="pk-podium-spot pk-spot-1">
          <div class="pk-spot-rank pk-spot-rank-1">1</div>
          <div class="pk-spot-card pk-spot-card-1">
            <img class="pk-winner-mark" src="{{ url_for('static', filename='assets/podium/winner_mark.png') }}" alt="" aria-hidden="true" />
            <div class="pk-spot-name" id="rank1Name">--</div>
            <div class="pk-spot-score">
              <span id="rank1Score">0</span>
              <img class="pk-chip" src="{{ url_for('static', filename='assets/podium/chip.png') }}" alt="Jeton" />
            </div>
            <div class="pk-spot-badge">Champion</div>
          </div>
        </div>

        <div class="pk-podium-spot pk-spot-3">
          <div class="pk-spot-rank">3</div>
          <div class="pk-spot-card">
            <div class="pk-spot-name" id="rank3Name">--</div>
            <div class="pk-spot-score">
              <span id="rank3Score">0</span>
              <img class="pk-chip" src="{{ url_for('static', filename='assets/podium/chip.png') }}" alt="Jeton" />
            </div>
          </div>
        </div>
      </section>

      <div class="pk-podium-note" id="podiumNote">En attente de la fin de partie...</div>

      <audio id="victoryAudio" preload="auto" src="{{ url_for('static', filename='assets/podium/victory.mp3') }}"></audio>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='podium_final.js') }}?v=pk5"></script>
</body>
</html>
